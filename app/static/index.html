<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>relate-comms — your messages, as a graph</title>
<meta name="color-scheme" content="dark" />
<link rel="stylesheet" href="/static/dist/app.css" />
</head>
<body>
<div id="root"></div>

<!--
  Vendored, not bundled: Cytoscape is ~440 KB and changes only on upgrade, so
  bundling it would rebuild it on every save during `npm run watch`.

  Order matters. fcose is a UMD bundle whose externals are `layout-base` and
  `cose-base`, which publish themselves on `window`.
-->
<script src="/static/vendor/cytoscape.min.js"></script>
<script src="/static/vendor/layout-base.js"></script>
<script src="/static/vendor/cose-base.js"></script>
<script src="/static/vendor/cytoscape-fcose.js"></script>
<script src="/static/dist/app.js"></script>
</body>
</html>
