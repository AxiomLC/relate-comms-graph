<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>relate-comms</title>
<style>
  :root {
    --bg: #05070a;
    --bg-lift: #0a1410;
    --orange: #8a3d12;
    --orange-text: #d97a2b;
    --blue-line: #1b2a4a;
    --blue-glow: #5c8fd6;
    --text: #c8d2e0;
    --muted: #6b7a90;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 Inter, system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--blue-line);
  }
  .badge {
    font-size: 11px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--blue-glow);
    box-shadow: 0 0 8px var(--blue-glow);
    display: inline-block;
    margin-right: 6px;
  }
  button {
    background: var(--orange);
    color: var(--orange-text);
    border: 1px solid var(--blue-line);
    border-radius: 8px;
    padding: 5px 11px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  input[type=search] {
    flex: 1;
    min-width: 120px;
    background: var(--bg-lift);
    border: 1px solid var(--blue-line);
    border-radius: 8px;
    color: var(--text);
    padding: 6px 10px;
    font: inherit;
  }
  main { flex: 1; display: flex; min-height: 0; }
  #canvas {
    flex: 1;
    position: relative;
    background:
      radial-gradient(circle at 50% 40%, rgba(92,143,214,.10), transparent 60%),
      var(--bg);
    overflow: hidden;
  }
  aside {
    width: 380px;
    border-left: 1px solid var(--blue-line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #viewer {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .row {
    padding: 7px 9px;
    border: 1px solid var(--blue-line);
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .row:hover { background: rgba(92,143,214,.08); }
  .meta { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .msg { border-bottom: 1px solid rgba(255,255,255,.06); padding: 8px 0; }
  .msg .who { color: var(--blue-glow); font-size: 11px; }
  .msg .body { white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--muted); padding: 20px 0; }
  .err { color: #d97a2b; }
</style>
</head>
<body>
<header>
  <span class="badge"><span class="dot"></span>offline · nothing leaves this machine</span>
  <input id="q" type="search" placeholder="Search messages…" />
  <button id="go">Search</button>
  <button id="reset">Graph</button>
</header>

<main>
  <div id="canvas">
    <div class="empty" style="padding:24px">
      Canvas lands here — sigma.js v4 + graphology (buildUI.md §4).
      The API behind it is live: <code>/api/graph</code>, <code>/api/thread/…</code>.
    </div>
  </div>
  <aside>
    <div id="viewer"><div class="empty">Click a thread, or search.</div></div>
  </aside>
</main>

<script>
const viewer = document.getElementById('viewer');

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function showResults(hits) {
  viewer.replaceChildren();
  viewer.append(el('h2', null, `${hits.length} result${hits.length === 1 ? '' : 's'}`));
  if (!hits.length) { viewer.append(el('div', 'empty', 'Nothing matched.')); return; }
  for (const hit of hits) {
    const row = el('div', 'row');
    row.append(el('div', null, hit.snippet || hit.key));
    row.append(el('div', 'meta', `${hit.platform} · ${hit.ts_utc} · ${hit.sender_name || 'unknown'}`));
    row.onclick = () => openThread(hit.thread_key);
    viewer.append(row);
  }
}

async function openThread(key) {
  viewer.replaceChildren(el('div', 'empty', 'Loading…'));
  try {
    const data = await api(`/api/thread/${encodeURIComponent(key)}?limit=50`);
    viewer.replaceChildren();
    viewer.append(el('h2', null, data.thread.title));
    viewer.append(el('div', 'meta',
      `${data.thread.platform} · ${data.total} messages` +
      (data.thread.correspondents.length ? ` · ${data.thread.correspondents.join(', ')}` : '')));
    for (const m of data.messages) {
      const box = el('div', 'msg');
      box.append(el('div', 'who', `${m.is_self ? 'you' : (m.sender_name || 'unknown')} · ${m.ts_utc}`));
      box.append(el('div', 'body', m.body || `(${m.raw_kind})`));
      viewer.append(box);
    }
    if (data.has_more) viewer.append(el('div', 'meta', 'more below — paging lands with the Viewer'));
  } catch (err) {
    viewer.replaceChildren(el('div', 'err', err.message));
  }
}

document.getElementById('go').onclick = async () => {
  const query = document.getElementById('q').value.trim();
  if (!query) return;
  try {
    const data = await api('/api/search', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ query, mode: 'substring', limit: 25 }),
    });
    showResults(data.hits);
  } catch (err) {
    viewer.replaceChildren(el('div', 'err', err.message));
  }
};

document.getElementById('q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('go').click();
});

document.getElementById('reset').onclick = async () => {
  try {
    const data = await api('/api/graph?limit=5');
    viewer.replaceChildren();
    viewer.append(el('h2', null, 'Graph'));
    viewer.append(el('div', 'meta',
      `${data.counts.nodes} nodes · ${data.counts.edges} edges` +
      (data.truncated ? ' · truncated' : '')));
    for (const node of data.nodes) {
      const row = el('div', 'row');
      row.append(el('div', null, node.label || node.id));
      row.append(el('div', 'meta', `${node.type} · ${node.message_count ?? ''}`));
      if (node.type === 'Thread') row.onclick = () => openThread(node.id);
      viewer.append(row);
    }
  } catch (err) {
    viewer.replaceChildren(el('div', 'err', err.message));
  }
};
</script>
</body>
</html>
