<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The app's own mark: three nodes on a ring, one merged at the centre. That is
       the canvas, in 32px — a bag ring and a merged node, which is the one thing
       this app draws that no other graph tool does. -->
  <rect width="32" height="32" rx="7" fill="#05070a"/>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#1d2a33" stroke-width="1"/>
  <circle cx="16" cy="5.5" r="2.6" fill="#3fb6b0"/>
  <circle cx="25.1" cy="21.3" r="2.6" fill="#4caf50"/>
  <circle cx="6.9" cy="21.3" r="2.6" fill="#5cc8f0"/>
  <circle cx="16" cy="16" r="3.4" fill="#d97a2b"/>
  <circle cx="16" cy="16" r="5.6" fill="none" stroke="#d97a2b" stroke-width="1" opacity="0.45"/>
</svg>
