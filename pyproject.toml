[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relate-comms"
version = "0.2.0"
description = "Your comms as a local graph: parse platform exports into Relate, query them with Cypher, optionally with a local model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]

# Library deps only. `relate` is the engine and is required; nothing here may
# depend on a network service.
dependencies = [
    "relate",
]

[project.optional-dependencies]
# Cross-platform name matching. Without it, resolution falls back to exact-only and
# reports the degradation, so it is optional but strongly recommended.
resolve = [
    "rapidfuzz>=3",
]
# Body-entity extraction. English-only in v1 by decision. `spacy` alone is not enough:
# the model is a separate download (`python -m spacy download en_core_web_sm`), and
# without it extraction degrades to no nodes plus one warning, never to an error.
extract = [
    "spacy>=3.7,<4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
# Everything the UI needs. Absent for library-only use, which is the point:
# importing relate_comms must not pull in a web server.
app = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "mcp",
]
dev = [
    "pytest>=8",
]

[project.scripts]
relate-comms = "relate_comms.cli:main"

[tool.setuptools.packages.find]
include = ["relate_comms*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
